<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .tile { fill: #fafafa; }
    .caret { stroke: #1d4ed8; }
    .cursor { fill: #18181b; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #0c0c0f; }
      .caret { stroke: #60a5fa; }
      .cursor { fill: #fafafa; }
    }
  </style>
  <rect class="tile" x="0" y="0" width="32" height="32" rx="6" />
  <polyline
    class="caret"
    points="9,9 16,16 9,23"
    fill="none"
    stroke-width="3.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <rect class="cursor" x="17" y="20.8" width="7" height="3.4" rx="1" />
</svg>
